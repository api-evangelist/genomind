aid: genomind
name: Genomind
description: >-
  Genomind is a US precision-medicine company in mental health, built around the Genomind
  Professional PGx pharmacogenetic test — a 26-gene panel (15 pharmacodynamic, 11 pharmacokinetic)
  used by clinicians to assess gene-drug and drug-drug interaction risk across more than 700
  medications. Alongside the CLIA-certified, CAP-accredited laboratory it operates a Precision
  Medicine Software product, a provider portal, a patient gateway and a partner portal, and it has
  built lab orders-and-results interfaces into EMR/EHR systems including Epic, athenahealth,
  NextGen Healthcare, DrChrono, Practice Fusion, iSalus and MedEnt. Genomind publishes no public
  developer program, API reference or machine-readable specification; its integration surface is a
  contracted HL7 v2 lab interface arranged per health system. In July 2026 Vanta Diagnostics
  acquired key Genomind assets, including the genetics lab, clinical operations and the
  direct-to-provider business, and the provider portal now carries Vanta Diagnostics branding.
